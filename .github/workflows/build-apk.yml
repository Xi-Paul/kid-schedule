# 주행 계측 앱(elevator-ride-meter-android)과 같은 파이프라인.
#   main 에 push  → Actions Artifacts 에 APK (본인 테스트용, 로그인 필요)
#   v* 태그 push  → Release 에 APK 첨부 (로그인 없이 받는 공개 링크)
# 다른 점: 안드로이드 프로젝트를 zip 으로 커밋하지 않고 CI 가 Capacitor 로 매번 생성합니다.
name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Capacitor 8 은 Node 22 이상을 요구합니다.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 의존성 설치
        run: npm ci || npm install

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - name: 버전 결정
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF#refs/tags/v}"
          else
            NAME="0.0.0-${GITHUB_SHA::7}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "빌드 버전: $NAME (code ${GITHUB_RUN_NUMBER})"

      - name: 웹 자산을 www/ 로
        run: npm run build

      - name: 안드로이드 프로젝트 생성
        run: npx cap add android

      - name: 권한·서명·버전 주입
        env:
          APP_VERSION_NAME: ${{ steps.ver.outputs.name }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: node scripts/patch-android.mjs

      - name: 플러그인 동기화
        run: npx cap sync android

      - name: 주입 결과 확인
        run: |
          echo "--- 권한 ---"
          grep -o 'android.permission.[A-Z_]*' android/app/src/main/AndroidManifest.xml | sort -u
          echo "--- 서명/버전 ---"
          sed -n '/patch-android.mjs/,/patch-android.mjs end/p' android/app/build.gradle

      - name: release APK 빌드
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 파일명 고정
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk out/kid-schedule.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: kid-schedule-apk
          path: out/kid-schedule.apk
          if-no-files-found: error

      - name: Release 발행
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/kid-schedule.apk
          generate_release_notes: true
